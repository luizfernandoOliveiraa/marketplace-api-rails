default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: marketplace_api_development
  username: marketplace_api
  password: 
  host: localhost
  port: 5432

test:
  <<: *default
  database: marketplace_api_test
  username: marketplace_api
  password:
  host: localhost
  port: 5432

production:
  primary: &primary_production
    <<: *default
    database: marketplace_api_production
    username: marketplace_api
    password: <%= ENV["MARKETPLACE_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: marketplace_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: marketplace_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: marketplace_api_production_cable
    migrations_paths: db/cable_migrate
